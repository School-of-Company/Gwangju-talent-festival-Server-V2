version: '3.8'

services:
  app:
    image: gwangju-festival:latest
    container_name: spring-app
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7.0
    container_name: redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
