spring:
  application:
    name: gwangjutalentfestival

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:500MB}
      max-request-size: ${MAX_REQUEST_SIZE:500MB}

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/gwangjutalentfestival?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      enabled: true
      file: docker-compose.dev.yml

jwt:
  secret: ${JWT_SECRET:4c5c48f97318aa1f2b44414c5782e85bda64d7cdd3a906138e7370af188e3360}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:180000000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004}

rate-limit:
  cooldown-seconds: ${RATE_LIMIT_COOLDOWN_SECONDS:1}

feign:
  log-level: ${FEIGN_LOG_LEVEL:BASIC}

solapi:
  api-key: ${COOL_SMS_KEY}
  api-secret: ${COOL_SMS_SECRET}
  sms-phonenumber: ${COOL_SMS_PHONENUMBER}
  url: ${SOLAPI_URL:https://api.solapi.com}

sms:
  verify:
    max-send-count: ${SMS_MAX_SEND_COUNT:5}
    verify-code-ttl: ${SMS_VERIFY_CODE_TTL:180}
    verify-count-ttl: ${SMS_VERIFY_COUNT_TTL:600}
    verify-count-key-prefix: ${SMS_VERIFY_COUNT_KEY_PREFIX:verify:count:}

logging:
  level:
    org.springframework.security: DEBUG

google:
  sheets:
    account-credential: ${GOOGLE_ACCOUNT_CREDENTIAL}
    sheet-id: ${GOOGLE_SHEET_ID}
    enrolled-sheet-page: ${GOOGLE_ENROLLED_SHEET_PAGE}
    out-of-school-sheet-page: ${GOOGLE_OUT_OF_SCHOOL_SHEET_PAGE}
  excel:
    template-sheet-id: ${GOOGLE_EXCEL_TEMPLATE_SHEET_ID}
    summary-page: ${GOOGLE_EXCEL_SUMMARY_PAGE}
    judge-template-sheet-id: ${GOOGLE_EXCEL_JUDGE_TEMPLATE_SHEET_ID}
    judge-template-page: ${GOOGLE_EXCEL_JUDGE_TEMPLATE_PAGE}

slogan:
  submission:
    start-at: ${START_AT:2026-04-18T00:00:00}
    end-at: ${END_AT:2026-05-28T18:00:00}

management:
  security:
    enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        seat.reservation.duration: true
        judge.submit.duration: true
  endpoints:
    web:
      exposure:
        include: health, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET}
    endpoint: ${AWS_S3_ENDPOINT:}

monitoring:
  anomaly:
    enabled: ${ANOMALY_DETECTOR_ENABLED:false}
    prometheus-base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
    discord-webhook-url: ${DISCORD_WEBHOOK_URL:}
  request-alert:
    enabled: ${REQUEST_ALERT_ENABLED:false}
    slow-threshold-millis: ${REQUEST_ALERT_SLOW_THRESHOLD_MILLIS:3000}
  ml:
    enabled: ${ML_ANOMALY_SCORE_ENABLED:false}
    base-url: ${ML_SERVER_BASE_URL:}
    timeout-ms: ${ML_SERVER_TIMEOUT_MS:3000}
  dataset:
    export-path: ${MONITORING_DATASET_EXPORT_PATH:./exports}
