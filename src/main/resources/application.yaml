spring:
  application:
    name: gwangjutalentfestival

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gwangjutalentfestival?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      enabled: true
      file: docker-compose.dev.yml

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:180000000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004}

feign:
  log-level: ${FEIGN_LOG_LEVEL:BASIC}

solapi:
  api-key: ${COOL_SMS_KEY}
  api-secret: ${COOL_SMS_SECRET}
  sms-phonenumber: ${COOL_SMS_PHONENUMBER}
  url: ${SOLAPI_URL:https://api.solapi.com}

sms:
  verify:
    max-send-count: ${SMS_MAX_SEND_COUNT:5}
    verify-code-ttl: ${SMS_VERIFY_CODE_TTL:180}
    verify-count-ttl: ${SMS_VERIFY_COUNT_TTL:600}
    verify-count-key-prefix: ${SMS_VERIFY_COUNT_KEY_PREFIX:verify:count:}

logging:
  level:
    org.springframework.security: DEBUG

google:
  sheets:
    account-credential: ${GOOGLE_ACCOUNT_CREDENTIAL}
    sheet-id: ${GOOGLE_SHEET_ID}
    enrolled-sheet-page: ${GOOGLE_ENROLLED_SHEET_PAGE}
    out-of-school-sheet-page: ${GOOGLE_OUT_OF_SCHOOL_SHEET_PAGE}

slogan:
  submission:
    start-at: ${START_AT:2026-04-18T00:00:00}
    end-at: ${END_AT:2026-05-28T18:00:00}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true