spring:
  application:
    name: gwangjutalentfestival

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:180000000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004}

feign:
  log-level: ${FEIGN_LOG_LEVEL:BASIC}

logging:
  level:
    org.springframework.security: DEBUG

google:
  sheets:
    account-credential: ${GOOGLE_ACCOUNT_CREDENTIAL}
    sheet-id: ${GOOGLE_SHEET_ID}
    sheet-page: ${GOOGLE_SHEET_PAGE}

slogan:
  submission:
    start-at: ${START_AT:2026-05-04T00:00:00}
    end-at: ${END_AT:2026-05-08T23:59:59}