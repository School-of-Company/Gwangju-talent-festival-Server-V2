spring:
  application:
    name: gwangjutalentfestival

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/gwangjutalentfestival?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false

  flyway:
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}

  docker:
    compose:
      enabled: false

jwt:
  secret: test-secret-key-for-junit-testing-only-32bytes!!
  access-token-expiration: 180000000
  refresh-token-expiration: 1209600

cors:
  allowed-origins: http://localhost:3000

feign:
  log-level: NONE

solapi:
  api-key: test-key
  api-secret: test-secret
  sms-phonenumber: "01000000000"
  url: https://api.solapi.com

sms:
  verify:
    max-send-count: 5
    verify-code-ttl: 180
    verify-count-ttl: 600
    verify-count-key-prefix: "verify:count:"

google:
  sheets:
    account-credential: test
    sheet-id: test
    enrolled-sheet-page: test
    out-of-school-sheet-page: test
  excel:
    template-sheet-id: test
    summary-page: test
    judge-template-sheet-id: test
    judge-template-page: test

slogan:
  submission:
    start-at: "2026-04-18T00:00:00"
    end-at: "2026-05-28T18:00:00"

# 테스트는 실제 예매를 수행하므로 항상 열린 기간으로 둔다.
seat:
  reservation:
    performer:
      start-at: "2000-01-01T00:00:00"
      end-at: "2099-12-31T23:59:59"
    user:
      start-at: "2000-01-01T00:00:00"
      end-at: "2099-12-31T23:59:59"

aws:
  s3:
    access-key: test-access-key
    secret-key: test-secret-key
    region: ap-northeast-2
    bucket: test-bucket

monitoring:
  anomaly:
    enabled: false
    prometheus-base-url: http://localhost:9090
    discord-webhook-url: ""
  request-alert:
    enabled: false
    slow-threshold-millis: 3000
  ml:
    enabled: false
    base-url: ""
    timeout-ms: 3000
  dataset:
    export-path: ./exports

judge:
  strokes:
    max-bytes: 20971520

management:
  security:
    enabled: false
  endpoints:
    web:
      exposure:
        include: health
